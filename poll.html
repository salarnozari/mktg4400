<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKTG:4400 · Live Question</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#ffffff;--tint:#f4f8f6;--green:#1b4332;--green2:#2d6a4f;
  --ink:#1a1a1a;--ink2:#3f3f3f;--grey:#6e6e6e;--light:#dcdcdc;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;
  display:flex;flex-direction:column}
.top{background:var(--green);color:#fff;padding:16px 20px;
  font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.wrap{flex:1;width:100%;max-width:640px;margin:0 auto;padding:28px 20px 40px}
.label{font:600 11px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--green2)}
#q{font:400 26px/1.25 var(--serif);color:var(--green);margin-top:10px;min-height:66px}
.rule{height:2px;background:var(--green);border:0;width:72px;margin:18px 0}
textarea{width:100%;min-height:120px;font:400 17px/1.5 var(--sans);color:var(--ink);
  padding:14px 16px;border:1px solid var(--light);border-left:3px solid var(--green);
  background:var(--tint);outline:none;border-radius:4px;resize:vertical}
textarea:focus{border-color:var(--green2)}
button{margin-top:14px;width:100%;font:650 17px/1 var(--sans);color:#fff;background:var(--green);
  border:0;border-radius:4px;padding:16px;cursor:pointer}
button:disabled{background:var(--grey);cursor:default}
.note{font:400 14px/1.5 var(--sans);color:var(--grey);margin-top:14px}
.done{border-left:3px solid var(--green);background:var(--tint);padding:18px 16px;
  font:400 17px/1.5 var(--sans);color:var(--ink);margin-top:18px;display:none}
.foot{padding:14px 20px;border-top:1px solid var(--light);
  font:500 11px/1 var(--sans);letter-spacing:.12em;color:var(--grey)}
</style>
</head>
<body>
<div class="top">MKTG:4400 · Digital Marketing · Live Question</div>
<div class="wrap">
  <p class="label">The question</p>
  <div id="q">Waiting for a question&hellip;</div>
  <hr class="rule">
  <div id="form">
    <div id="mc" style="display:none"></div>
    <textarea id="a" maxlength="300" placeholder="Your answer"></textarea>
    <button id="send" disabled>Send answer</button>
    <p class="note">Answers are anonymous and appear on the screen at the front.</p>
  </div>
  <div class="done" id="done">Answer sent. Watch the screen.</div>
</div>
<div class="foot">UNIVERSITY OF IOWA · FALL 2026</div>
<script>
/* ================= CONFIG =================
   SUPA_URL and SUPA_KEY: same Supabase project URL and public
   API key as in the deck slide, no trailing slash on the URL.
   See docs/live-poll-setup.md.  */
const SUPA_URL="https://xvelgscbfuqrqpgqqjea.supabase.co";
const SUPA_KEY="sb_publishable_WcKAF-DLWPiCbCSiqyKLmA_W6trrLHV";
/* ========================================== */
const $=id=>document.getElementById(id);
const H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
let qts=null, answered=null, choices=[], sending=false;
try{answered=localStorage.getItem('mktg4400-answered')}catch(e){}
function renderQ(){
  const mc=choices.length>0;
  $('a').style.display=mc?'none':'block';
  $('send').style.display=mc?'none':'block';
  $('mc').style.display=mc?'block':'none';
  $('mc').innerHTML=mc?choices.map((c,i)=>'<button class="opt" data-i="'+i+'">'+esc(c)+'</button>').join(''):'';
  if(mc)$('mc').querySelectorAll('button').forEach(b=>
    b.addEventListener('click',()=>sendAnswer(choices[+b.dataset.i])));
}
function setState(){
  const open=qts!==null;
  const done=open&&String(qts)===answered;
  $('send').disabled=!open||done||sending;
  $('mc').querySelectorAll('button').forEach(b=>b.disabled=!open||done||sending);
  $('done').style.display=done?'block':'none';
  $('form').style.display=done?'none':'block';
}
async function poll(){
  if(!SUPA_URL||!SUPA_KEY){$('q').textContent='Not configured yet. Set SUPA_URL and SUPA_KEY in poll.html.';return;}
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/live_question?id=eq.1&select=text,ts,choices',{headers:H,cache:'no-store'});
    const q=(await r.json())[0];
    if(q&&q.text){
      if(q.ts!==qts){
        qts=q.ts;$('q').textContent=q.text;$('a').value='';
        try{choices=q.choices?JSON.parse(q.choices):[]}catch(e){choices=[]}
        if(!Array.isArray(choices))choices=[];
        renderQ();
      }
    }else{qts=null;choices=[];renderQ();$('q').innerHTML='Waiting for a question&hellip;';}
  }catch(e){}
  setState();
}
poll();setInterval(poll,4000);
async function sendAnswer(t){
  if(!t||qts===null||sending)return;
  sending=true;$('send').textContent='Sending…';setState();
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/live_answers',
      {method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({qts:qts,text:t,ts:Date.now()})});
    if(!r.ok)throw 0;
    try{localStorage.setItem('mktg4400-answered',String(qts))}catch(e){}
    answered=String(qts);
  }catch(e){alert('Could not send. Check your connection and try again.');}
  sending=false;$('send').textContent='Send answer';setState();
}
$('send').addEventListener('click',()=>sendAnswer($('a').value.trim()));
</script>
</body>
</html>
